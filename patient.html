<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setu Health - Patient Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <main id="dashboard" hidden>
    <h1>Patient Dashboard</h1>
    <p id="welcome"></p>
    <p>View your care information, appointments, and health records.</p>
    <button type="button" onclick="Auth.logout()">Sign out</button>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await Auth.requireRole('patient');
      if (!session) return;
      document.getElementById('welcome').textContent = `Signed in as ${session.profile.full_name || session.user.email}`;
      document.getElementById('dashboard').hidden = false;
    });
  </script>
</body>
</html>
